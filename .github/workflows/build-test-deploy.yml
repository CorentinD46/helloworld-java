name: build-test-deploy

on:
  workflow_dispatch: 
  push:
    branches: [main]
    
env:
  DEPLOY_ENV: production
  
jobs:
  build:
    name: Build app
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Java JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '17'
      - run: mvn clean package -DskipTests



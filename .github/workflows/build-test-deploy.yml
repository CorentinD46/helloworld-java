name: build-test-deploy

on:
  workflow_dispatch: 
  push:
    branches: [main]

jobs:
  build:
    name: Build app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn clean package -DskipTests

env:
  DEPLOY_ENV: production
